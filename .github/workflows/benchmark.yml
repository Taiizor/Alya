name: Benchmark

on:
  workflow_dispatch:
    inputs:
      os:
        description: 'Target Operating System'
        type: choice
        required: true
        default: 'ubuntu-latest'
        options:
          - 'ubuntu-latest'
          - 'windows-latest'
          - 'macos-latest'
          - 'all'
      mode:
        description: 'Benchmark Suite Mode'
        type: choice
        required: true
        default: 'comprehensive'
        options:
          - 'comprehensive'
          - 'standard'
      iterations:
        description: 'Benchmark Measurement Iterations'
        type: choice
        required: true
        default: '5'
        options:
          - '3'
          - '5'
          - '10'
      update_readme:
        description: 'Update benchmarks/README.md and README.md with results'
        type: boolean
        required: false
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.os || 'default' }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  benchmark:
    name: Benchmark (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: inputs.os == 'all' || matrix.os == inputs.os
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Alya compiler (Release)
        run: cargo build --release

      - name: Run cross-language benchmarks
        shell: bash
        run: |
          ARGS="--suite ${{ inputs.mode }} --iterations ${{ inputs.iterations }}"
          if [ "${{ inputs.update_readme }}" = "true" ] && ( [ "${{ matrix.os }}" = "ubuntu-latest" ] || [ "${{ inputs.os }}" != "all" ] ); then
            ARGS="$ARGS --update-readme"
          fi
          bun run benchmarks/cross_lang/runner.ts $ARGS

      - name: Commit and push benchmark results
        if: inputs.update_readme == true && (matrix.os == 'ubuntu-latest' || inputs.os != 'all')
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add benchmarks/README.md README.md
          if git diff --staged --quiet; then
            echo "No changes in benchmark results."
          else
            git commit -m "docs(benchmarks): update benchmark results [skip ci]"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push
          fi
