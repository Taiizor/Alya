name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: false
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: alyac
            archive: tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            bin: alyac
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: alyac
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: alyac.exe
            archive: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package artifacts (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          VERSION="${{ github.ref_name || inputs.tag }}"
          PACKAGE_NAME="alyac-${VERSION}-${{ matrix.target }}"
          mkdir "${PACKAGE_NAME}"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "${PACKAGE_NAME}/"
          cp README.md LICENSE "${PACKAGE_NAME}/"
          tar -czvf "${PACKAGE_NAME}.tar.gz" "${PACKAGE_NAME}"
          shasum -a 256 "${PACKAGE_NAME}.tar.gz" > "${PACKAGE_NAME}.tar.gz.sha256"

      - name: Package artifacts (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $Version = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "${{ inputs.tag }}" }
          $PackageName = "alyac-$Version-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $PackageName | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin }}" -Destination $PackageName
          Copy-Item README.md, LICENSE -Destination $PackageName
          Compress-Archive -Path $PackageName -DestinationPath "$PackageName.zip"
          $hash = (Get-FileHash -Algorithm SHA256 "$PackageName.zip").Hash.ToLower()
          "$hash  $PackageName.zip" | Out-File -FilePath "$PackageName.zip.sha256" -Encoding ascii

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            alyac-*.tar.gz
            alyac-*.tar.gz.sha256
            alyac-*.zip
            alyac-*.zip.sha256
          generate_release_notes: true
