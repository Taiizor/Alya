name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.0.2)'
        required: true
        default: 'v0.0.2'
      prerelease:
        description: 'Mark as prerelease'
        type: boolean
        required: true
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: x86_64-linux
            bin: alyac
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: x86_64-macos
            bin: alyac
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: arm64-macos
            bin: alyac
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: x86_64-windows
            bin: alyac.exe
            archive: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package artifacts (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          VERSION="${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          PACKAGE_NAME="alyac-${VERSION}-${{ matrix.platform }}"
          mkdir "${PACKAGE_NAME}"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "${PACKAGE_NAME}/"
          cp README.md LICENSE "${PACKAGE_NAME}/"
          tar -czvf "${PACKAGE_NAME}.tar.gz" "${PACKAGE_NAME}"
          shasum -a 256 "${PACKAGE_NAME}.tar.gz" > "${PACKAGE_NAME}.tar.gz.sha256"

      - name: Package artifacts (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $Version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "${{ inputs.tag }}" }
          $PackageName = "alyac-$Version-${{ matrix.platform }}"
          New-Item -ItemType Directory -Force -Path $PackageName | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin }}" -Destination $PackageName
          Copy-Item README.md, LICENSE -Destination $PackageName
          Compress-Archive -Path $PackageName -DestinationPath "$PackageName.zip"
          $hash = (Get-FileHash -Algorithm SHA256 "$PackageName.zip").Hash.ToLower()
          "$hash  $PackageName.zip" | Out-File -FilePath "$PackageName.zip.sha256" -Encoding ascii

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            alyac-*-${{ matrix.platform }}.*
          if-no-files-found: error

  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Generate Release Notes
        shell: bash
        run: |
          VERSION="${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          REPO="${{ github.repository }}"

          LINUX_PKG="alyac-${VERSION}-x86_64-linux.tar.gz"
          MAC_ARM_PKG="alyac-${VERSION}-arm64-macos.tar.gz"
          MAC_X64_PKG="alyac-${VERSION}-x86_64-macos.tar.gz"
          WIN_PKG="alyac-${VERSION}-x86_64-windows.zip"

          LINUX_SHA=$(awk '{print $1}' "dist/${LINUX_PKG}.sha256" 2>/dev/null | tr -d '\r\n' || echo "—")
          MAC_ARM_SHA=$(awk '{print $1}' "dist/${MAC_ARM_PKG}.sha256" 2>/dev/null | tr -d '\r\n' || echo "—")
          MAC_X64_SHA=$(awk '{print $1}' "dist/${MAC_X64_PKG}.sha256" 2>/dev/null | tr -d '\r\n' || echo "—")
          WIN_SHA=$(awk '{print $1}' "dist/${WIN_PKG}.sha256" 2>/dev/null | tr -d '\r\n' || echo "—")

          [ -z "$LINUX_SHA" ] && LINUX_SHA="—"
          [ -z "$MAC_ARM_SHA" ] && MAC_ARM_SHA="—"
          [ -z "$MAC_X64_SHA" ] && MAC_X64_SHA="—"
          [ -z "$WIN_SHA" ] && WIN_SHA="—"

          cat <<EOF > release_notes.md
          Alya is an expressive, compiled, multi-paradigm systems programming language designed for clarity, performance, and simplicity.

          ### 📦 Pre-built Binaries & Checksums

          | Platform | Architecture | Package | SHA-256 Checksum |
          |:---|:---|:---|:---|
          | <img src="https://svgl.app/library/linux.svg" width="16" height="16" valign="middle" alt="Linux" /> **Linux** | \`x86_64\` | [${LINUX_PKG}](https://github.com/${REPO}/releases/download/${VERSION}/${LINUX_PKG}) ([sha256](https://github.com/${REPO}/releases/download/${VERSION}/${LINUX_PKG}.sha256)) | \`${LINUX_SHA}\` |
          | <picture><source media="(prefers-color-scheme: dark)" srcset="https://svgl.app/library/apple_dark.svg"><source media="(prefers-color-scheme: light)" srcset="https://svgl.app/library/apple.svg"><img src="https://svgl.app/library/apple.svg" width="16" height="16" valign="middle" alt="macOS" /></picture> **macOS** | Apple Silicon (\`arm64\`) | [${MAC_ARM_PKG}](https://github.com/${REPO}/releases/download/${VERSION}/${MAC_ARM_PKG}) ([sha256](https://github.com/${REPO}/releases/download/${VERSION}/${MAC_ARM_PKG}.sha256)) | \`${MAC_ARM_SHA}\` |
          | <picture><source media="(prefers-color-scheme: dark)" srcset="https://svgl.app/library/apple_dark.svg"><source media="(prefers-color-scheme: light)" srcset="https://svgl.app/library/apple.svg"><img src="https://svgl.app/library/apple.svg" width="16" height="16" valign="middle" alt="macOS" /></picture> **macOS** | Intel (\`x86_64\`) | [${MAC_X64_PKG}](https://github.com/${REPO}/releases/download/${VERSION}/${MAC_X64_PKG}) ([sha256](https://github.com/${REPO}/releases/download/${VERSION}/${MAC_X64_PKG}.sha256)) | \`${MAC_X64_SHA}\` |
          | <img src="https://svgl.app/library/windows.svg" width="16" height="16" valign="middle" alt="Windows" /> **Windows** | \`x86_64\` | [${WIN_PKG}](https://github.com/${REPO}/releases/download/${VERSION}/${WIN_PKG}) ([sha256](https://github.com/${REPO}/releases/download/${VERSION}/${WIN_PKG}.sha256)) | \`${WIN_SHA}\` |

          ---

          ### 🚀 Quick Start

          #### Linux / macOS
          \`\`\`bash
          # 1. Extract the archive
          tar -xzf alyac-${VERSION}-<platform>.tar.gz
          cd alyac-${VERSION}-<platform>

          # 2. Check compiler version
          ./alyac --version

          # 3. Run an Alya program directly
          ./alyac run main.alya

          # 4. Or compile to a native binary
          ./alyac build main.alya
          \`\`\`

          #### Windows (PowerShell)
          \`\`\`powershell
          # 1. Extract the archive
          Expand-Archive alyac-${VERSION}-x86_64-windows.zip
          cd alyac-${VERSION}-x86_64-windows

          # 2. Check compiler version
          .\alyac.exe --version

          # 3. Run an Alya program directly
          .\alyac.exe run main.alya
          \`\`\`

          ---

          ### 🔒 Checksum Verification

          \`\`\`bash
          # Linux / macOS
          shasum -a 256 -c alyac-${VERSION}-<platform>.tar.gz.sha256

          # Windows (PowerShell)
          (Get-FileHash alyac-${VERSION}-x86_64-windows.zip -Algorithm SHA256).Hash.ToLower()
          \`\`\`

          ---
          EOF

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "Alya ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          prerelease: ${{ inputs.prerelease == true || (inputs.prerelease != false && contains(github.ref_name, '-')) }}
          body_path: release_notes.md
          generate_release_notes: true
          files: dist/*
