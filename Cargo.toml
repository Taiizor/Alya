[package]
name = "alya"
version = "0.0.11"
edition = "2021"
rust-version = "1.75"
authors = ["Taiizor <taiizor@vegalya.com>"]
description = "A simple, intuitive, and modern multi-platform compiled programming language"
license = "MIT"
readme = "README.md"
homepage = "https://github.com/alya-lang/alya"
repository = "https://github.com/alya-lang/alya"
documentation = "https://github.com/alya-lang/alya#readme"
keywords = ["alya", "compiler", "programming-language", "codegen", "assembly"]
categories = ["compilers", "development-tools"]
exclude = [".github/", "tests/", "temp_*", "*.s"]

[dependencies]

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[lib]
name = "alya"
path = "src/lib.rs"

[[bin]]
name = "alyac"
path = "src/main.rs"

[[bench]]
name = "compiler_bench"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
