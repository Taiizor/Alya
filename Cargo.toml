[package]
name = "alya"
version = "0.0.2"
edition = "2021"
rust-version = "1.75"
authors = ["Taiizor <taiizor@vegalya.com>"]
description = "A simple, intuitive, and modern multi-platform compiled programming language"
license = "MIT"
readme = "README.md"
homepage = "https://github.com/Taiizor/Alya"
repository = "https://github.com/Taiizor/Alya"
documentation = "https://github.com/Taiizor/Alya#readme"
keywords = ["alya", "compiler", "programming-language", "codegen", "assembly"]
categories = ["compilers", "development-tools"]
exclude = [".github/", "tests/", "temp_*", "*.s"]

[dependencies]

[lib]
name = "alya"
path = "src/lib.rs"

[[bin]]
name = "alyac"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
